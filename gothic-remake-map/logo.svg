    <g transform="translate(320,62) scale(0.92) "><g transform="translate(-70.5,0)" fill="none" stroke="#120904" stroke-linecap="round" stroke-width="2.2" opacity=".9"><path d="M37,-12 V8M37,26 L37,96"/><path d="M14,17 H60"/></g></g>

    <!-- REMAKE -->
    <g filter="url(#stoneS)">
      <g fill="none" stroke="#fff" stroke-width="5.2" stroke-linecap="butt" stroke-linejoin="miter"><path d="M2,20V2H11L15,6V11L11,14H2M9,14L15,20" transform="translate(226.5,190)"/><path d="M15,2H2V20H15M2,11H12" transform="translate(260.5,190)"/><path d="M2,20V2L8.5,12L15,2V20" transform="translate(294.5,190)"/><path d="M2,20L8.5,2L15,20M5,14H12" transform="translate(328.5,190)"/><path d="M2,2V20M15,2L2,13M6,10L15,20" transform="translate(362.5,190)"/><path d="M15,2H2V20H15M2,11H12" transform="translate(396.5,190)"/></g>
