name: Homepage V2.6 — browser smoke and performance

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'js/script.js'
      - 'js/home-lib.js'
      - 'js/home-dash.js'
      - 'css/home-v2.css'
      - 'tests/home-perf.cjs'
      - '.github/workflows/home-perf.yml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-and-timing:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: JavaScript syntax checks
        run: |
          node --check js/script.js
          node --check js/home-lib.js
          node --check js/home-dash.js
          node --check tests/home-perf.cjs
      - name: Install headless browser tooling
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1 lighthouse@12
          npx playwright install --with-deps chromium
      - name: Launch local site
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/bp-http.log 2>&1 &
          echo $! > /tmp/bp-http.pid
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/bp-http.log
          exit 1
      - name: Chromium desktop and mobile smoke + metrics
        env:
          BP_TEST_URL: http://127.0.0.1:8000/
        run: node tests/home-perf.cjs
      - name: Lighthouse mobile and desktop diagnostics
        run: |
          export CHROME_PATH="$(node -e 'console.log(require("playwright").chromium.executablePath())')"
          npx lighthouse http://127.0.0.1:8000/ --only-categories=performance --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --output=json --output-path=/tmp/bp-lighthouse-mobile.json --quiet
          npx lighthouse http://127.0.0.1:8000/ --only-categories=performance --preset=desktop --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --output=json --output-path=/tmp/bp-lighthouse-desktop.json --quiet
          node - <<'NODE'
          const fs = require('node:fs');
          const report = ['### Lighthouse performance diagnostics','','| Profile | Score | FCP | LCP | TBT | CLS |','|---|---:|---:|---:|---:|---:|'];
          for (const profile of ['mobile','desktop']) {
            const json = JSON.parse(fs.readFileSync('/tmp/bp-lighthouse-' + profile + '.json','utf8'));
            const a = json.audits;
            const val = id => a[id]?.displayValue || 'n/a';
            const score = Math.round(100 * (json.categories.performance.score || 0));
            report.push('| ' + profile + ' | ' + score + '/100 | ' + val('first-contentful-paint') + ' | ' + val('largest-contentful-paint') + ' | ' + val('total-blocking-time') + ' | ' + val('cumulative-layout-shift') + ' |');
          }
          report.push('','*Local GitHub-hosted CI run; simulated throttling, not production RUM or CrUX. Scores are observations, not release gates.*');
          const out = report.join('\n') + '\n';
          console.log(out);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,out);
          NODE
