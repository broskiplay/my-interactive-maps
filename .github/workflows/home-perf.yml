name: Homepage V2.6 — browser smoke and performance

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'js/script.js'
      - 'js/home-lib.js'
      - 'js/home-dash.js'
      - 'css/home-v2.css'
      - 'tests/home-perf.cjs'
      - '.github/workflows/home-perf.yml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-and-timing:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: JavaScript syntax checks
        run: |
          node --check js/script.js
          node --check js/home-lib.js
          node --check js/home-dash.js
          node --check tests/home-perf.cjs
      - name: Install headless browser tooling
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Launch local site
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/bp-http.log 2>&1 &
          echo $! > /tmp/bp-http.pid
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/bp-http.log
          exit 1
      - name: Chromium desktop and mobile smoke + metrics
        env:
          BP_TEST_URL: http://127.0.0.1:8000/
        run: node tests/home-perf.cjs
