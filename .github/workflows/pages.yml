# Сборка и публикация сайта broskiplay.ru на GitHub Pages.
# Сгенерированные страницы (база данных db/, страницы категорий <игра>/c/, страницы локаций <игра>/<карта>/)
# в репозитории не хранятся — их создают генераторы из scripts/ при каждом push в main.
# Настройка репозитория: Settings → Pages → Source: «GitHub Actions».
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Генерация страниц
        env:
          JSC: ${{ github.workspace }}/scripts/jsc_node.cjs   # вместо macOS JavaScriptCore
        run: |
          python3 scripts/category_pages.py
          python3 scripts/db_pages.py
          python3 scripts/map_pages.py
          db=$(find db -name index.html | wc -l); cat=$(find . -path './*-map/c/*' -name index.html | wc -l); loc=$(ls -d *-map/*/index.html | wc -l)
          echo "страниц: база $db, категории $cat, локации $loc"
          # что-то сломалось в генераторах — не выкладываем сайт без страниц
          [ "$db" -gt 3000 ] && [ "$cat" -gt 300 ] && [ "$loc" -gt 30 ]

      - name: Подготовка к публикации
        run: rm -rf scripts .github tests   # служебное и тесты — не выкладываем на сайт

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
